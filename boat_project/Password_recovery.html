    <script>
        $(document).ready(function() {
            $("#emailForm").submit(function(event) {
                event.preventDefault();
                var email = $("#email").val();
                if (email === "") {
                    alert("Please enter your email.");
                    return;
                }
                
                $.post("reset-password.php", { send_otp: true, email: email }, function(response) {
                    $("#message").text(response);
                    if (response.includes("OTP sent")) {
                        $("#emailForm").hide();
                        $("#otpForm").show();
                    }
                });
            });

            $("#otpForm").submit(function(event) {
                event.preventDefault();
                var otp = $("#otp").val();
                var newPassword = $("#new_password").val();
                var confirmPassword = $("#confirm_password").val();
                
                if (otp === "" || newPassword === "" || confirmPassword === "") {
                    alert("Please fill in all fields.");
                    return;
                }

                $.post("reset-password.php", { verify_otp: true, email: $("#email").val(), otp: otp, new_password: newPassword, confirm_password: confirmPassword }, function(response) {
                    $("#message").text(response);
                    if (response.includes("Password Reset Successful")) {
                        $("#otpForm").hide();
                    }
                });
            });
        });
    </script>
